# Кэш сессий.
#
#   docker compose -f redis-compose.yml up -d
#
# Сервису redis доступен по имени внутри docker-сети. Наружу порт не открыт:
# публикуется только на loopback сервера, подключаться через SSH-туннель
#
#   ssh -L 6379:127.0.0.1:6379 <сервер>

name: fitb-redis

networks:
  network:
    external: true

services:
  redis:
    image: redis:8-alpine
    container_name: redis
    restart: always
    networks:
      network:
        aliases: [redis]
    # Адрес обязателен: без него docker открыл бы порт на все интерфейсы
    # в обход ufw, и redis оказался бы в интернете
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?задайте REDIS_PASSWORD в .env}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
