# Кэш сессий. Порты наружу не публикуются — redis доступен только внутри docker-сети.
#
#   docker compose -f redis-compose.yml up -d

name: fitb-redis

networks:
  network:
    external: true

services:
  redis:
    image: redis:8-alpine
    container_name: redis
    restart: always
    networks:
      network:
        aliases: [redis]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?задайте REDIS_PASSWORD в .env}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
