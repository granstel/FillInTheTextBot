# Контейнер сервиса. Имя проекта задаёт rollout.sh — во время раската живут оба цвета.
#
#   VERSION=1.27.0 docker compose -p fitb-green -f service-compose.yml up -d --wait

networks:
  network:
    external: true

services:
  fitb:
    image: ${IMAGE_REPO:-granstel/fillinthetextbot}:${VERSION:?задайте VERSION}
    restart: unless-stopped
    networks:
      network:
        # Одинаковый у обоих цветов
        aliases:
          - ${SERVICE_ALIAS:-fitb}
    env_file:
      - ${APP_ENV_FILE:-./app.env}
    volumes:
      - ${KEYS_DIR:?задайте KEYS_DIR в .env}:/app/keys:ro
    # Больше, чем DrainDelaySeconds + Shutdown.TimeoutSeconds сервиса
    stop_grace_period: ${STOP_TIMEOUT:-45}s
    # Docker provider не включает starting/unhealthy контейнер в Traefik.
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/80;
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          read -r status <&3;
          [[ "$$status" == "HTTP/1.1 200 "* ]]
      interval: 3s
      timeout: 2s
      start_period: 15s
      start_interval: 1s
      retries: 3
    labels:
      app: fitb
      traefik.enable: "true"
      traefik.docker.network: ${DOCKER_NETWORK:-network}
      traefik.http.routers.fitb.rule: "Host(`${DOMAIN:?задайте DOMAIN в .env}`)"
      traefik.http.routers.fitb.entrypoints: websecure
      traefik.http.routers.fitb.tls: "true"
      traefik.http.routers.fitb.tls.certresolver: le
      traefik.http.services.fitb.loadbalancer.server.port: "80"
      traefik.http.services.fitb.loadbalancer.healthcheck.path: /health
      traefik.http.services.fitb.loadbalancer.healthcheck.interval: 3s
      traefik.http.services.fitb.loadbalancer.healthcheck.timeout: 2s
