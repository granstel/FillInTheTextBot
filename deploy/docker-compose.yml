# Пограничный прокси: терминирует TLS, сам выпускает и продлевает сертификат
# Let's Encrypt, и маршрутизирует трафик на контейнеры сервиса.
#
# Сам сервис (fitb) этим compose НЕ поднимается — его раскатывает rollout.sh
# с перекрытием старого и нового экземпляра, чтобы обновление шло без простоя.
# Traefik обнаруживает контейнеры сервиса по docker-меткам на общей сети.
#
# Запускается один раз и работает постоянно:
#   docker compose -f deploy/docker-compose.yml up -d

name: fitb-edge

networks:
  # Та же сеть, где живут redis/prometheus и контейнеры сервиса.
  # Создаётся отдельно (см. README), поэтому external.
  network:
    external: true

services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: always
    networks:
      - network
    ports:
      - "80:80"
      - "443:443"
    command:
      # --- Провайдер: читаем конфигурацию из меток docker-контейнеров ---
      - --providers.docker=true
      # Ничего не публикуем наружу без явной метки traefik.enable=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=network

      # --- Точки входа ---
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Весь http автоматически переводим на https. Запросы ACME-проверки
      # (/.well-known/acme-challenge/...) Traefik обслуживает до редиректа,
      # поэтому выпуск сертификата не ломается.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      # --- Let's Encrypt (HTTP-01 challenge на 80 порту) ---
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web

      # Заголовки, чьё имя является алиасом управляемого Traefik заголовка,
      # отбрасываем — иначе клиент может подменить X-Forwarded-*.
      - --entrypoints.web.http.aliasHeadersStrategy=delete
      - --entrypoints.websecure.http.aliasHeadersStrategy=delete

      - --log.level=INFO
      - --accesslog=true
    volumes:
      # Только чтение сокета: Traefik лишь наблюдает за контейнерами
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Хранилище сертификатов; acme.json Traefik создаёт сам с правами 600
      - ./acme:/acme
