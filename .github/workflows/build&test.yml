name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@v6.1.0
      with:
        global-json-file: global.json
    - name: Build and test
      run: |
        REDIS_TEST_IMAGE="$(docker compose -f deploy/redis-compose.yml config --no-interpolate --images)"
        export REDIS_TEST_IMAGE
        dotnet test --verbosity normal src/FillInTheTextBot.slnx
